version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - revive
    - staticcheck
    - unused
  
  exclusions:
    paths:
      - vendor
      - "^ADS$"
      - "^ADS/.*"
      - "^gen$"
      - "^worker$"
      - "^web$"
    
    rules:
      - source: "func New"
        linters:
          - revive
        text: "argument-limit"
      - source: "func writeResponse"
        linters:
          - revive
        text: "argument-limit"
      - source: "func ProcessJob"
        linters:
          - revive
        text: "argument-limit"
      - path: _test\.go
        linters:
          - revive
        text: "add-constant"

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      disable-default-exclusions: false
      verbose: true

    unused:
      field-writes-are-uses: true
      post-statements-are-reads: true
      exported-fields-are-used: false
      parameters-are-used: true
      local-variables-are-used: true
      generated-is-used: true

    govet:
      disable-all: true
      enable:
        - copylocks
        - lostcancel
        - printf
        - unmarshal
        - unreachable
        - unsafeptr
        - loopclosure
        - nilfunc
        - shift
        - structtag
        - tests
        - testinggoroutine

      settings:
        printf:
          funcs:
            - (agreements-generator/internal/logger.Logger).Debug
            - (agreements-generator/internal/logger.Logger).Info
            - (agreements-generator/internal/logger.Logger).Warn
            - (agreements-generator/internal/logger.Logger).Error
            - (agreements-generator/internal/logger.Logger).Fatal

    revive:
      severity: warning
      confidence: 0.8
      rules:
        - name: add-constant
          arguments:
            - max-lit-count: "3"
              allow-strs: '""'
              allow-ints: "0,1,2"
              allow-floats: "0.0,0.,1.0,1.,2.0,2."
        - name: argument-limit
          arguments: [ 4 ]
        - name: atomic
        - name: bare-return
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: cognitive-complexity
          arguments: [ 20 ]
        - name: confusing-naming
        - name: confusing-results
        - name: constant-logical-expr
        - name: context-as-argument
          arguments:
            - allow-types-before: "*testing.T,*github.com/user/repo/testing.Harness"
        - name: context-keys-type
        - name: defer
          arguments:
          - ["call-chain", "loop", "method-call", "recover", "immediate-recover", "return"]
        - name: dot-imports
        - name: duplicated-imports
        - name: empty-block
        - name: enforce-repeated-arg-type-style
          arguments:
            - "short"
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: flag-parameter
        - name: forbidden-call-in-wg-go
        - name: identical-branches
        - name: if-return
        - name: indent-error-flow
        - name: range
        - name: range-val-in-closure
        - name: redefines-builtin-id
        - name: unconditional-recursion
        - name: use-errors-new
        - name: function-result-limit
          arguments: [4]
        - name: import-shadowing
        - name: increment-decrement
        - name: modifies-value-receiver
        - name: receiver-naming
          arguments:
            - max-length: 2
        - name: superfluous-else
        - name: time-equal
        - name: time-naming
        - name: unchecked-type-assertion
        - name: unused-parameter
          arguments: ["^_"]
        - name: unused-receiver
          arguments: ["^_"]
        - name: use-any
        - name: var-naming
          arguments:
            - ["ID", "API", "HTTP", "JSON", "URL"]
        - name: waitgroup-by-value

    staticcheck:
      checks:
        - "SA*"
        - "S*"
        - "-ST*"
        - "-S1032"

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    gofmt:
      simplify: true

    goimports:
      local-prefixes:
        - "avito-shop"

  exclusions:
    generated: strict
    paths:
      - ".*\\.pb\\.go$"
      - ".*_mock\\.go$"

issues:
  max-same-issues: 0
  uniq-by-line: false
  fix: true

run:
  timeout: 5m
  tests: false
  concurrency: 4
  go: "1.26"
  modules-download-mode: readonly

severity:
  default: error
  rules:
    - linters:
        - dupl
        - goconst
      severity: info

services:
  worker:
    container_name: worker
    build: ./worker/
    ports:
      - "50051:50051"
  
  server:
    container_name: server
    build: .
    ports:
      - "8080:8080"
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - ./config/local.yaml:/root/config.yaml
    depends_on:
      - worker
      - redis
  
  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379-6379"
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    

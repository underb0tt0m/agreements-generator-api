services:
  worker:
    container_name: worker
    build: ./worker/
    ports:
      - "50051:50051"
    environment:
      PYTHONUNBUFFERED: 1
    env_file:
      - .env
    volumes:
      - ./config/worker_local.yaml:/app/config/config.yaml
    depends_on:
      server:
        condition: service_healthy
  
  server:
    container_name: server
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./config/server_local.yaml:/root/config.yaml
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
        
  db:
    container_name: db
    image: postgres:18-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker

  migrations:
    container_name: migrations
    image: migrate/migrate:v4.19.1
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    volumes:
      - ./internal/storage/postgres/migrations:/migrations
    depends_on:
      db:
         condition: service_healthy
  
  redis:
    container_name: redis
    image: redis:7-alpine
    env_file:
      - .env
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management-alpine
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data:
    

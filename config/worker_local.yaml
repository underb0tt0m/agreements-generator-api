execution_mode: "queue" #grpc | queue

max_workers: 1

grpc_server:
  port: 50051

db:
  host: "db"
  port: 5432
  db_name: "generator"
  user: "postgres"
  max_conn: 10

redis:
  host: "redis"
  port: 6379
  job_status_ttl: 600

rabbit_mq:
  host: "rabbitmq"
  port: 5672
  user: "guest"
  v_host: "/"
  queue: "jobs"